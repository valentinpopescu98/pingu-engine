name: CMake cross-platform build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify committed Linux shared libraries
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          for name in libdraco.so.4 libglfw.so.3 libassimp.so.5 liblua5.4.so.0 libminizip.so.1; do
            test -f "deps/linux/x86_64/lib/$name" || { echo "Missing committed dependency: $name"; exit 1; }
            git ls-files --error-unmatch "deps/linux/x86_64/lib/$name"
          done

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang-14 libgl1-mesa-dev patchelf

      - name: Show Linux compiler version
        if: runner.os == 'Linux'
        run: clang++-14 --version

      - name: Show Windows compiler version
        if: runner.os == 'Windows'
        shell: pwsh
        run: clang-cl --version

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_C_COMPILER=clang-14 -DCMAKE_CXX_COMPILER=clang++-14

      # Binary archives are immutable in GitHub Actions cache. Use a fresh key
      # per run/job so newly built packages (notably Assimp) are saved too.
      # Debug and Release share the same x64-windows vcpkg package graph.
      - name: Restore vcpkg binary cache
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: vcpkg-binary-windows-x64-0c2a9ace1964b818b15f7ae50ba1c42404918a7b-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.build_type }}
          restore-keys: |
            vcpkg-binary-windows-x64-0c2a9ace1964b818b15f7ae50ba1c42404918a7b-${{ hashFiles('vcpkg.json') }}-

      # Keep vcpkg's pinned bootstrap binary and downloaded build tools across runs.
      # A cache miss still bootstraps normally; the checked-out port tree stays pinned.
      - name: Restore pinned vcpkg tool and downloads
        id: vcpkg_tool_cache
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: |
            C:/vcpkg/vcpkg.exe
            C:/vcpkg/downloads
          key: vcpkg-tool-downloads-windows-0c2a9ace1964b818b15f7ae50ba1c42404918a7b-v1

      - name: Pin vcpkg tool and configure binary cache
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          $binaryCache = Join-Path $env:GITHUB_WORKSPACE '.vcpkg-binary-cache'
          New-Item -ItemType Directory -Force $binaryCache | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$binaryCache,readwrite"
          # CMake's vcpkg toolchain performs the sole manifest installation.
          # Persist its cache configuration into the subsequent Configure Windows step.
          "VCPKG_BINARY_SOURCES=$env:VCPKG_BINARY_SOURCES" >> $env:GITHUB_ENV
          Write-Host "vcpkg binary cache: $binaryCache"
          git -C $vcpkgRoot fetch --depth=1 origin 0c2a9ace1964b818b15f7ae50ba1c42404918a7b
          if ($LASTEXITCODE -ne 0) { throw "vcpkg pin fetch failed" }
          git -C $vcpkgRoot checkout --detach 0c2a9ace1964b818b15f7ae50ba1c42404918a7b
          if ($LASTEXITCODE -ne 0) { throw "vcpkg pin checkout failed" }
          $vcpkgExe = Join-Path $vcpkgRoot 'vcpkg.exe'
          if ("${{ steps.vcpkg_tool_cache.outputs.cache-hit }}" -eq "true" -and (Test-Path $vcpkgExe)) {
            Write-Host "Reusing cached vcpkg tool for pinned revision"
            & $vcpkgExe version
            if ($LASTEXITCODE -ne 0) { throw "Cached vcpkg tool is not executable" }
          } else {
            Write-Host "Pinned vcpkg tool cache miss; bootstrapping"
            & "$vcpkgRoot/bootstrap-vcpkg.bat" -disableMetrics
            if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          }

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=clang-cl
          -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      # Save after CMake's manifest installation, including newly built packages.
      - name: Save vcpkg binary cache
        if: runner.os == 'Windows'
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: vcpkg-binary-windows-x64-0c2a9ace1964b818b15f7ae50ba1c42404918a7b-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 2

      - name: Collect Linux binary provenance and package copyright
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/bin/licenses build/bin/licenses/ubuntu-packages
          cp LICENSE.md build/bin/licenses/PINGU-ENGINE-LICENSE.md
          cp third_party/licenses/* build/bin/licenses/
          {
            echo "Ubuntu 22.04 / x86_64 vendored ELF provenance"
            echo "File SHA-256 is computed from the exact repository binary."
            echo "Package versions below are from the current Ubuntu 22.04 APT repository; binary-to-package equality is not assumed."
            sha256sum deps/linux/x86_64/lib/*.so*
          } > build/bin/licenses/BINARY-PROVENANCE.txt
          declare -A mapping=(
            [libglfw3]=libglfw.so.3
            [libassimp5]=libassimp.so.5
            [liblua5.4-0]=liblua5.4.so.0
            [libdraco4]=libdraco.so.4
            [libminizip1]=libminizip.so.1
          )
          for pkg in "${!mapping[@]}"; do
            ver="$(apt-cache policy "$pkg" | awk '/Candidate:/ {print $2; exit}')"
            echo "$pkg candidate version: $ver" >> build/bin/licenses/BINARY-PROVENANCE.txt
            if [[ -z "$ver" || "$ver" == "(none)" ]]; then
              echo "Missing Ubuntu package candidate: $pkg" >&2
              exit 1
            fi
            mkdir -p /tmp/pingu-license-pkgs/"$pkg"
            (cd /tmp/pingu-license-pkgs/"$pkg" && apt-get download "$pkg=$ver")
            deb="$(find /tmp/pingu-license-pkgs/"$pkg" -maxdepth 1 -name '*.deb' -print -quit)"
            dpkg-deb -x "$deb" /tmp/pingu-license-pkgs/"$pkg"/extracted
            notice="/tmp/pingu-license-pkgs/$pkg/extracted/usr/share/doc/$pkg/copyright"
            if [[ ! -f "$notice" ]]; then
              echo "Missing Ubuntu package copyright: $pkg" >&2
              exit 1
            fi
            cp "$notice" "build/bin/licenses/ubuntu-packages/$pkg-copyright"
            actual="$(sha256sum "deps/linux/x86_64/lib/${mapping[$pkg]}" | cut -d' ' -f1)"
            packaged="$(find -L /tmp/pingu-license-pkgs/"$pkg"/extracted/usr/lib -name "${mapping[$pkg]}*" -type f -print -quit)"
            if [[ -n "$packaged" ]]; then
              packaged_sha="$(sha256sum "$packaged" | cut -d' ' -f1)"
              if [[ "$actual" == "$packaged_sha" ]]; then
                echo "$pkg vendored binary MATCHES downloaded Ubuntu package" >> build/bin/licenses/BINARY-PROVENANCE.txt
              else
                echo "$pkg vendored binary differs from current Ubuntu package; package license notice included but origin remains unverified" >> build/bin/licenses/BINARY-PROVENANCE.txt
              fi
            fi
          done

      - name: Bundle Windows licenses and binary provenance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build/bin/licenses | Out-Null
          Copy-Item LICENSE.md build/bin/licenses/PINGU-ENGINE-LICENSE.md
          Copy-Item third_party/licenses/* build/bin/licenses/
          # vcpkg ports ship their actual redistribution notices in share/<port>/copyright.
          # Preserve all installed ports, including transitive/static dependencies.
          $triplet = Join-Path (Resolve-Path 'build/vcpkg_installed') 'x64-windows'
          $share = Join-Path $triplet 'share'
          if (-not (Test-Path $share)) { throw "Missing vcpkg share directory: $share" }
          $noticeDir = 'build/bin/licenses/vcpkg-packages'
          New-Item -ItemType Directory -Force $noticeDir | Out-Null
          $ports = @(Get-ChildItem $share -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'copyright') })
          if ($ports.Count -eq 0) { throw "No vcpkg package copyright files found" }
          foreach ($port in $ports) {
            Copy-Item (Join-Path $port.FullName 'copyright') (Join-Path $noticeDir "$($port.Name)-copyright")
          }
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          $packages = & $vcpkg list --triplet x64-windows --x-install-root (Resolve-Path 'build/vcpkg_installed')
          if ($LASTEXITCODE -ne 0) { throw "vcpkg list failed" }
          $packages | Set-Content build/bin/licenses/VCPKG-INSTALLED-PACKAGES.txt
          $missingNotices = @()
          foreach ($line in $packages) {
            if ($line -match '^([^: ]+):x64-windows\s') {
              $portName = $Matches[1]
              if (-not (Test-Path (Join-Path $noticeDir "$portName-copyright"))) {
                $missingNotices += $portName
              }
            }
          }
          if ($missingNotices.Count -gt 0) {
            throw "Missing copyright notices for vcpkg ports: $($missingNotices -join ', ')"
          }
          $lines = @(
            "Windows x64 - DLLs packaged from vcpkg installation",
            "vcpkg checkout: $((git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD) -join '')",
            "Package versions: see VCPKG-INSTALLED-PACKAGES.txt",
            "Package notices: see vcpkg-packages/*-copyright"
          )
          foreach ($dll in Get-ChildItem build/bin -Filter *.dll) {
            $hash = (Get-FileHash $dll.FullName -Algorithm SHA256).Hash
            $version = $dll.VersionInfo.FileVersion
            $lines += "$($dll.Name): SHA256=$hash; PE FileVersion=$version"
          }
          $lines += "Legacy committed Windows DLLs are not linked or packaged."
          $lines | Set-Content build/bin/licenses/BINARY-PROVENANCE.txt

      - name: Upload executable and runtime resources
        uses: actions/upload-artifact@v6
        with:
          name: pingu-engine-${{ matrix.os }}-${{ matrix.build_type }}
          path: build/bin/
          if-no-files-found: error

  compatibility-smoke:
    name: ${{ matrix.distro }} / binary compatibility smoke test
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Ubuntu 24.04
            runner: ubuntu-24.04
            image: ubuntu:24.04
            packages: "libopengl0 libgl1-mesa-dri libgl1 xvfb xauth file binutils"
          - distro: Fedora
            runner: ubuntu-24.04
            image: fedora:44
            packages: "libglvnd-opengl libglvnd-glx mesa-dri-drivers libX11 libxcb xorg-x11-server-Xvfb xorg-x11-xauth findutils file binutils"
          - distro: Arch
            runner: ubuntu-24.04
            image: archlinux:base-20261018.0.612668
            packages: "libglvnd mesa libx11 libxcb xorg-server-xvfb xorg-xauth findutils file binutils"
          - distro: Windows Server 2025
            runner: windows-2025
            image: ""
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install distro runtime and test utilities
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y ${{ matrix.packages }}
          elif command -v dnf >/dev/null; then
            dnf install -y ${{ matrix.packages }}
          else
            pacman -Syu --noconfirm
            pacman -S --needed --noconfirm ${{ matrix.packages }}
          fi
      - name: Download Ubuntu 22.04 Release artifact
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v7
        with:
          name: pingu-engine-ubuntu-22.04-Release
          path: release
      - name: Verify shared libraries and launch OpenGL 3.3
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "3.3"
        run: |
          set -euo pipefail
          chmod +x release/pingu-engine
          file release/pingu-engine
          # Audit the executable AND every bundled shared library, including
          # libraries that the executable may not directly reference.
          mapfile -d '' shared_objects < <(find release/lib -maxdepth 1 -type f -name '*.so*' -print0)
          if (( ${#shared_objects[@]} == 0 )); then
            echo "No bundled Linux shared libraries found" >&2
            exit 1
          fi
          for binary in release/pingu-engine "${shared_objects[@]}"; do
            echo "=== ldd: $binary ==="
            output="$(ldd "$binary" 2>&1)" || {
              printf '%s\\n' "$output"
              echo "ldd failed for $binary" >&2
              exit 1
            }
            printf '%s\\n' "$output"
            if grep -Eq 'not found|not a dynamic executable' <<< "$output"; then
              echo "Unresolved dependency in $binary" >&2
              exit 1
            fi
          done
          # No LD_LIBRARY_PATH: validate bundled ELF RUNPATH on other distros.
          timeout 30s xvfb-run -a -s "-screen 0 1280x720x24" ./release/pingu-engine --smoke-test


      - name: Download Windows Server 2022 Release build
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v7
        with:
          name: pingu-engine-windows-2022-Release
          path: release
      - name: Check executable and bundled DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path (Resolve-Path release) 'pingu-engine.exe'
          if (-not (Test-Path $exe)) { throw "Missing Windows executable" }
          $dlls = @(Get-ChildItem release -Filter '*.dll' | Select-Object -ExpandProperty Name)
          if ($dlls.Count -eq 0) { throw "No bundled runtime DLLs" }
          Write-Host "Bundled runtime DLLs: $($dlls -join ', ')"
          foreach ($pattern in @('glfw*.dll', 'assimp*.dll', 'lua*.dll')) {
            if (-not (Get-ChildItem release -Filter $pattern)) {
              throw "Missing runtime matching $pattern"
            }
          }
          $native = @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeDll {
            [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
            public static extern IntPtr LoadLibraryW(string name);
            [DllImport("kernel32.dll", SetLastError=true)]
            public static extern bool FreeLibrary(IntPtr module);
          }
          '@
          Add-Type -TypeDefinition $native
          # LoadLibraryW on a full path does not automatically search that
          # DLL's directory for its dependencies. Make artifact DLLs discoverable.
          $env:PATH = "$(Resolve-Path release);$env:PATH"
          foreach ($dll in $dlls) {
            $path = Join-Path (Resolve-Path release) $dll
            $handle = [NativeDll]::LoadLibraryW($path)
            if ($handle -eq [IntPtr]::Zero) {
              throw "Failed loading $dll (Win32 error $([Runtime.InteropServices.Marshal]::GetLastWin32Error()))"
            }
            [void][NativeDll]::FreeLibrary($handle)
            Write-Host "Successfully loaded $dll on Windows Server 2025"
          }
          Write-Host "DLL load test passed. OpenGL initialization is not tested on Windows runners."
